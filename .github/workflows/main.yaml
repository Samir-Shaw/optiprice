name: OptiPrice CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint and Syntax Validation
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Smoke Test on Predict Pipeline
        run: |
          python -c "from src.pipeline.predict_pipeline import CustomData, PredictPipeline; data = CustomData('Electronics', 120.0, 155.0, 85, 1.8, 4.5, 1, 2); df = data.get_data_as_data_frame(); pipe = PredictPipeline(); price = pipe.predict(df); print('Inference test passed. Output price:', price[0])"